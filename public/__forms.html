<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Rudrani Forms</title></head>
  <body>
    <form name="wedding-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="wedding-enquiry">
      <input name="bot-field">
      <input name="name">
      <input name="phone">
      <input name="wedding-date">
      <input name="city">
      <select name="guests"><option>Under 100</option></select>
      <select name="functions"><option>1–2 Functions</option></select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
